name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
          - target: macos-x86_64
            os: macos-13
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.rust_target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="singlecli-${{ matrix.target }}"
          mkdir -p "$out"
          cp target/${{ matrix.rust_target }}/release/single "$out/"
          cp target/${{ matrix.rust_target }}/release/single-runtimed "$out/"
          tar -czf "$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: singlecli-${{ matrix.target }}
          path: singlecli-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
